<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="LC Digital Tec" (click)="closeMenu()">
      <span>
        <strong>LC Digital Tec</strong>
        <small>Desenvolvimento web e sistemas</small>
      </span>
    </a>

    <button class="menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="main-navigation" [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'">
      {{ menuOpen ? 'Fechar' : 'Menu' }}
    </button>

    <nav id="main-navigation" aria-label="Navegação principal" (keydown.escape)="closeMenu()" class="nav-menu" [class.open]="menuOpen">
      <a routerLink="/sobre" (click)="closeMenu()">Sobre nós</a>
      <a routerLink="/" fragment="servicos" (click)="closeMenu()">Serviços</a>
      <a routerLink="/clientes" (click)="closeMenu()">Clientes</a>
      <a routerLink="/contato" (click)="closeMenu()">Contato</a>
      <a
        href="https://wa.me/5531986204749?text=Ol%C3%A1%2C%20gostaria%20de%20pedir%20uma%20proposta."
        class="proposal-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Pedir proposta pelo WhatsApp"
        (click)="closeMenu()"
      >
        Pedir proposta →
      </a>
    </nav>
  </div>
</header>
