<section class="login-page">
  <div class="login-card">
    <a routerLink="/" class="back-link">← Voltar para o site</a>

    <div class="login-header">
      <img src="/assets/logo.svg?v=2" alt="LC Digital Tec" />
      <h1>Área administrativa</h1>
      <p>Acesse o painel da LC Digital Tec para gerenciar conteúdos, clientes e serviços.</p>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <p class="security-notice" role="note">
        Ambiente demonstrativo: a autenticação ainda não está conectada. Não use uma senha real.
      </p>

      <label>
        E-mail
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin&#64;lcdigitaltec.com.br"
          autocomplete="username"
          required
        />
      </label>

      <label>
        Senha
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        />
      </label>

      <button type="submit">Entrar no painel</button>

      @if (message) {
        <p class="login-message" role="status">{{ message }}</p>
      }
    </form>
  </div>
</section>
